<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Vibes Photo Booths — Theme</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0e1626; color: #f4efe4; font-family: Georgia, "Times New Roman", serif; }
  main { width: min(420px, 92vw); text-align: center; padding: 32px 20px; }
  p.kicker { letter-spacing: .28em; text-transform: uppercase; font-size: 11px; color: #c4a35a; margin: 0 0 10px; font-family: system-ui, sans-serif; }
  h1 { font-weight: 500; font-size: 28px; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: #c4a35a; font-size: 14px; }
  audio { width: 100%; }
  footer { margin-top: 22px; font-size: 12px; letter-spacing: .08em; color: #8a8070; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<main>
  <p class="kicker">Good Vibes Photo Booths</p>
  <h1>The theme.</h1>
  <p class="sub">A teaser for the night.</p>
  <audio controls preload="metadata" src="https://cdn.jsdelivr.net/gh/LLCGoodVibes-wq/gv-theme@main/theme.mp3"></audio>
  <footer>joseph@goodvibesphotobooths.net</footer>
</main>
</body>
</html>
